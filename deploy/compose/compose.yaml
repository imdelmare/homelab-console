name: ${COMPOSE_PROJECT_NAME:-homelab-console}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-console}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-console}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-console} -d $${POSTGRES_DB:-console}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      APP_ENV: live
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-console}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-console}}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-720}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUSTED_PROXY_ENABLED: "true"
      ALLOW_INSECURE_LOCAL_TLS: ${ALLOW_INSECURE_LOCAL_TLS:-false}
      AUTH_NOTIFICATION_ADAPTER: telegram
      AUTH_LOGIN_MODE: ${AUTH_LOGIN_MODE:-password}
      AUTH_RECOVERY_ENABLED: ${AUTH_RECOVERY_ENABLED:-true}
      APPROVAL_TTL_SECONDS: ${APPROVAL_TTL_SECONDS:-600}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:?TELEGRAM_ALLOWED_USER_ID is required}
      TELEGRAM_ALLOWED_CHAT_ID: ${TELEGRAM_ALLOWED_CHAT_ID:?TELEGRAM_ALLOWED_CHAT_ID is required}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET is required}
      TELEGRAM_NOTIFICATIONS_ENABLED: ${TELEGRAM_NOTIFICATIONS_ENABLED:-false}
      NOTIFICATION_OUTBOX_ENABLED: ${NOTIFICATION_OUTBOX_ENABLED:-true}
      NOTIFICATION_WORKER_INTERVAL_SECONDS: ${NOTIFICATION_WORKER_INTERVAL_SECONDS:-2}
      NOTIFICATION_WARNING_DEBOUNCE_SECONDS: ${NOTIFICATION_WARNING_DEBOUNCE_SECONDS:-900}
      NOTIFICATION_COOLDOWN_SECONDS: ${NOTIFICATION_COOLDOWN_SECONDS:-7200}
      NOTIFICATION_CRITICAL_DEBOUNCE_SECONDS: ${NOTIFICATION_CRITICAL_DEBOUNCE_SECONDS:-120}
      NOTIFICATION_CRITICAL_COOLDOWN_SECONDS: ${NOTIFICATION_CRITICAL_COOLDOWN_SECONDS:-1800}
      NOTIFICATION_AGGREGATION_WINDOW_SECONDS: ${NOTIFICATION_AGGREGATION_WINDOW_SECONDS:-120}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
      OPERATIONAL_RETENTION_ENABLED: ${OPERATIONAL_RETENTION_ENABLED:-true}
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS:-3600}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-180}
      TOOL_INVOCATION_RETENTION_DAYS: ${TOOL_INVOCATION_RETENTION_DAYS:-90}
      WATCHER_RUN_RETENTION_DAYS: ${WATCHER_RUN_RETENTION_DAYS:-90}
      NOTIFICATION_OUTBOX_RETENTION_DAYS: ${NOTIFICATION_OUTBOX_RETENTION_DAYS:-90}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-1000}
      HOMELAB_CONFIG_PATH: /app/config/homelab.yml
      SECRETS_PATH: /app/config/secrets.yml
      RUNBOOKS_CONFIG_PATH: /app/config/runbooks.yml
      AUDIT_JSONL_ENABLED: "false"
      CONVERSATION_ENABLED: "false"
      TASK_ROUTER_ENABLED: "false"
      INCIDENT_MATCHER_ENABLED: "true"
      TELEGRAM_MEDIA_ENABLED: "false"
      WATCHERS_ENABLED: ${WATCHERS_ENABLED:-true}
      WATCHERS_INTERVAL_SECONDS: ${WATCHERS_INTERVAL_SECONDS:-600}
      WATCHERS_MIN_SEVERITY: ${WATCHERS_MIN_SEVERITY:-warning}
      WATCHERS_IGNORE_PATTERNS: ${WATCHERS_IGNORE_PATTERNS:-}
      WATCHERS_RESOLVE_AFTER_MISSING_RUNS: ${WATCHERS_RESOLVE_AFTER_MISSING_RUNS:-3}
    volumes:
      - ${HOMELAB_CONFIG_FILE:-../../config/homelab.local.yml}:/app/config/homelab.yml:ro
      - ${SECRETS_FILE:-../../config/secrets.local.yml}:/app/config/secrets.yml:ro
      - ${RUNBOOKS_CONFIG_FILE:-../../config/runbooks.example.yml}:/app/config/runbooks.yml:ro
      - api-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    stop_grace_period: 90s
    depends_on:
      db:
        condition: service_healthy

  mcp-http:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.mcp
    restart: unless-stopped
    environment:
      APP_ENV: live
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-console}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-console}}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      HOMELAB_CONFIG_PATH: /app/apps/api/config/homelab.yml
      SECRETS_PATH: /app/apps/api/config/secrets.yml
      RUNBOOKS_CONFIG_PATH: /app/apps/api/config/runbooks.yml
      CONVERSATION_ENABLED: "false"
      TASK_ROUTER_ENABLED: "false"
      MCP_TRANSPORT: streamable-http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 8765
      MCP_HTTP_PATH: ${MCP_HTTP_PATH:-/mcp/}
      MCP_HTTP_ALLOWED_HOSTS: ${MCP_HTTP_ALLOWED_HOSTS:-127.0.0.1:8765,localhost:8765}
      MCP_HTTP_ALLOWED_ORIGINS: ${MCP_HTTP_ALLOWED_ORIGINS:-}
    volumes:
      - ${HOMELAB_CONFIG_FILE:-../../config/homelab.local.yml}:/app/apps/api/config/homelab.yml:ro
      - ${SECRETS_FILE:-../../config/secrets.local.yml}:/app/apps/api/config/secrets.yml:ro
      - ${RUNBOOKS_CONFIG_FILE:-../../config/runbooks.example.yml}:/app/apps/api/config/runbooks.yml:ro
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-8765}:8765"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    stop_grace_period: 90s
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_MCP_ENDPOINT: ${VITE_MCP_ENDPOINT:-}
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
  postgres-data:
