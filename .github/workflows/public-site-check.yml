name: Public site validation

on:
  pull_request:
    paths:
      - ".github/workflows/public-site-check.yml"
      - "public-site/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-site-check.yml"
      - "public-site/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate managed public artifact
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("public-site")
          required = [root / "index.html", root / "docs" / "index.html"]
          for expected in required:
              if not expected.is_file():
                  raise SystemExit(f"Missing required public artifact: {expected}")

          blocked = {
              "private domain": re.compile(r"grafichedelmare\.com", re.I),
              "private workstation": re.compile(r"delmare-desk", re.I),
              "private network": re.compile(r"\b(?:10(?:\.\d{1,3}){3}|192\.168(?:\.\d{1,3}){2}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2})\b"),
              "private source repository": re.compile(r"github\.com/imdelmare/homelab-console", re.I),
              "private key": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "GitHub token": re.compile(r"\b(?:gh[opsu]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,})\b"),
              "AWS access key": re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
          }
          text_suffixes = {".css", ".html", ".js", ".json", ".md", ".txt", ".xml"}

          for path in sorted(root.rglob("*")):
              if path.is_symlink():
                  raise SystemExit(f"Symbolic links are not allowed: {path}")
              if path.suffix == ".map":
                  raise SystemExit(f"Source maps are not allowed: {path}")
              if not path.is_file() or path.suffix not in text_suffixes:
                  continue
              content = path.read_text(encoding="utf-8")
              for category, pattern in blocked.items():
                  if pattern.search(content):
                      raise SystemExit(f"{path} contains a blocked {category}")

          print("Public site artifact validation passed.")
