name: Public repository validation

on:
  pull_request:
  push:
    branches:
      - main
      - automation/public-site
      - automation/community-release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate privacy and publication ownership
        shell: python
        run: |
          from pathlib import Path
          import os
          import re
          import subprocess

          root = Path(".")
          site = root / "public-site"
          for expected in (site / "index.html", site / "docs" / "index.html"):
              if not expected.is_file():
                  raise SystemExit(f"Missing required public artifact: {expected}")

          blocked = {
              "private domain": re.compile(r"grafichedelmare\.com", re.I),
              "private workstation": re.compile(r"delmare-desk", re.I),
              "private network": re.compile(r"\b(?:10\.10\.10|10\.255\.0)\.\d{1,3}\b"),
              "private AI host": re.compile(r"\bserver-ai\b", re.I),
              "private host platform": re.compile(r"\bCasaOS\b", re.I),
              "private ISP label": re.compile(r"\b(?:Fastweb|Iliad)\b", re.I),
              "private organization": re.compile(r"Grafiche\s+Delmare", re.I),
              "private source repository": re.compile(
                  r"github\.com/imdelmare/homelab-console(?!-sentinel|-remediation-worker)",
                  re.I,
              ),
              "local workstation path": re.compile(r"/home/delmare(?:/|\b)", re.I),
              "private key": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              "GitHub token": re.compile(r"\b(?:gh[opsu]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,})\b"),
              "AWS access key": re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              "bearer credential": re.compile(r"Authorization\s*:\s*Bearer\s+[A-Za-z0-9._~+/-]{16,}", re.I),
          }
          credential_url = re.compile(
              r"[a-z][a-z0-9+.-]*://(?P<username>[^\s/:@]+):(?P<password>[^\s/@]+)@",
              re.I,
          )
          excluded = {Path(".github/workflows/public-site-check.yml")}

          for path in sorted(root.rglob("*")):
              if path in excluded or ".git" in path.parts:
                  continue
              if path.is_symlink():
                  raise SystemExit(f"Symbolic links are not allowed: {path}")
              if path.suffix == ".map":
                  raise SystemExit(f"Source maps are not allowed: {path}")
              if not path.is_file():
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for category, pattern in blocked.items():
                  if pattern.search(content):
                      raise SystemExit(f"{path} contains a blocked {category}")
              for match in credential_url.finditer(content):
                  if match.group("username") == "example" and match.group("password") == "example":
                      continue
                  raise SystemExit(f"{path} contains a blocked credential-bearing URL")

          ref = os.environ.get("GITHUB_REF", "")
          if ref == "refs/heads/automation/public-site":
              allowed = ("public-site/",)
          elif ref == "refs/heads/automation/community-release":
              allowed = (
                  ".community-export-manifest",
                  ".dockerignore",
                  ".env.example",
                  ".gitignore",
                  "LICENSE",
                  "README.md",
                  "SECURITY.md",
                  "THIRD_PARTY_NOTICES.md",
                  "apps/",
                  "config/",
                  "deploy/",
                  "docs/",
                  "scripts/",
                  ".github/workflows/ci.yml",
                  ".github/workflows/containers.yml",
                  ".github/workflows/public-site-check.yml",
              )
          else:
              allowed = ()

          if allowed:
              subprocess.run(["git", "fetch", "--no-tags", "origin", "main"], check=True)
              changed = subprocess.run(
                  ["git", "diff", "--name-only", "origin/main...HEAD"],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout.splitlines()
              for changed_path in changed:
                  if not any(
                      (
                          changed_path.startswith(prefix)
                          if prefix.endswith("/")
                          else changed_path == prefix
                      )
                      for prefix in allowed
                  ):
                      raise SystemExit(
                          f"Automation branch changed a path outside its ownership: {changed_path}"
                      )

          print("Public repository privacy and ownership validation passed.")

  upsert-pull-request:
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/automation/public-site' ||
       github.ref == 'refs/heads/automation/community-release')
    needs: validate
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create or update publication pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="${GITHUB_REF#refs/heads/}"
          if [[ "$branch" == "automation/public-site" ]]; then
            title="docs: sync sanitized public site"
            body="Automated sanitized documentation update. Only \`public-site/\` is managed by this branch; merge remains an explicit operator decision."
          else
            title="feat: sync containerized community edition"
            body="Automated allowlisted Community Edition source update. Public containers are built only after this PR is reviewed and merged; merge remains an explicit operator decision."
          fi

          pr_number="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$branch" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "$title" \
              --body "$body"
          fi
