# Copy to config/secrets.local.yml and fill locally.
# This file documents the expected shape only. Do not commit real secrets.

proxmox:
  # Create a dedicated API token in Proxmox (Datacenter -> Permissions ->
  # API Tokens) with the PVEAuditor role. Username/password authentication
  # is not supported.
  api_token_id: reader@example!console
  api_token_secret: ""
  # Optional, separate least-privilege token used only by approved LXC power
  # tools. Keep privilege separation enabled and scope VM.PowerMgmt ACLs to
  # the intended /vms/<vmid> paths. Never replace the reader token above.
  power_api_token_id: writer@example!console
  power_api_token_secret: ""

pbs:
  # API token (Configuration -> Access Control -> API Token) with a
  # read-only role. Username/password authentication is not supported.
  api_token_id: reader@example!console
  api_token_secret: ""

opnsense:
  # Create a dedicated API key pair in OPNsense (System -> Access -> Users ->
  # API keys) for a read-only user.
  api_key: ""
  api_secret: ""
  # Separate least-privilege network-action identity. Grant only the exact
  # os-wol, gateway configuration/status and routing-table privileges required
  # by the approved tools. Write tools never fall back to reader credentials.
  wol_api_key: ""
  wol_api_secret: ""

homeassistant:
  # Long-lived access token (Profile -> Security -> Long-lived access tokens).
  token: ""

frigate:
  # Optional, only if the Frigate instance requires authentication.
  token: ""
  api_key: ""

adguard:
  username: ""
  password: ""

nextcloud:
  username: ""
  # App password (Settings -> Security -> Devices & sessions), not the login
  # password.
  app_password: ""

nutups:
  # Optional: only if upsd requires USERNAME/PASSWORD for read access.
  username: ""
  password: ""

mikrotik:
  username: ""
  password: ""

zerotier:
  # Personal API token from ZeroTier Legacy Central. The provider is
  # read-only and only queries network IDs declared in homelab config.
  api_token: ""

fritzbox_primary:
  username: ""
  password: ""

fritzbox_secondary:
  username: ""
  password: ""

asterisk:
  username: ""
  secret: ""

uptimekuma:
  # API key (Settings -> API Keys), used for the Prometheus /metrics endpoint.
  api_key: ""

emqx:
  # API key pair (Dashboard -> System -> API Keys).
  api_key: ""
  api_secret: ""

cloudflaretunnel:
  # Account-scoped API token with Cloudflare Tunnel Read only. This is not
  # the eyJ... runtime token used to start cloudflared.
  bearer_token: ""

vps:
  glances:
    # Optional: only if Glances is started with a static API token
    # (glances --password / api-token). Leave empty for an unauthenticated
    # local/WireGuard-only Glances instance.
    token: ""

# For an optional `api_provider_instances` entry, use the same instance id as
# a top-level key. The json_health_v1 bearer token is optional.
# example_service:
#   bearer_token: ""

# cloudflare_home:
#   # Account-scoped API token with only Cloudflare Tunnel Read permission.
#   bearer_token: ""
